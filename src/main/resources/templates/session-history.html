<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session history</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
</head>
<body>
<div class="container mt-5">
    <h2>Session History</h2>
    <div th:if="${visitHistory != null && !visitHistory.isEmpty()}">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Page URL</th>
                <th>Timestamp</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry, iterStat : ${visitHistory}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="${entry.split(' at ')[0]}">Visited Page URL</td>
                <td th:text="${entry.split(' at ')[1]}">Timestamp</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${visitHistory == null || visitHistory.isEmpty()}">
        <p class="alert alert-info">No visit history found.</p>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
