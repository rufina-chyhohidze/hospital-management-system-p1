<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
</head>
<body>
<nav>
    <a href="/patients">All Patients</a> | <a href="/doctors">All Doctors</a> | <a href="/patients/add">Add Patient</a> | <a href="/doctors/add">Add Doctor</a>
</nav>
<h1>All Doctors</h1>
<table>
    <thead>
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>License Number</th>
        <th>Salary</th>
        <th>Department</th>
        <th>Hire Date</th>
        <th>Gender</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doctor : ${doctors}">
        <td th:text="${doctor.firstName}">First Name</td>
        <td th:text="${doctor.lastName}">Last Name</td>
        <td th:text="${doctor.licenseNumber}">License Number</td>
        <td th:text="${doctor.salary}">Salary</td>
        <td th:text="${doctor.department}">Department</td>
        <td th:text="${doctor.hireDate}">Hire Date</td>
        <td th:text="${doctor.gender}">Gender</td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}">Home</a> | <a th:href="@{/doctors/add}">Add Doctor</a>
</body>
</html>
