<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1 class="mb-4">All Doctors</h1>


    <a href="/doctors/add" class="btn btn-primary mb-3">Add New Doctor</a>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>License Number</th>
                <th>Salary</th>
                <th>Department</th>
                <th>Hire Date</th>
                <th>Gender</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.firstName}">First Name</td>
                <td th:text="${doctor.lastName}">Last Name</td>
                <td th:text="${doctor.licenseNumber}">License Number</td>
                <td th:text="${doctor.salary}">Salary</td>
                <td th:text="${doctor.department}">Department</td>
                <td th:text="${doctor.hireDate}">Hire Date</td>
                <td th:text="${doctor.gender}">Gender</td>
                <td>
                    <a th:href="@{/doctors/{licenseNumber}(licenseNumber=${doctor.licenseNumber})}" class="btn btn-info">View Details</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
