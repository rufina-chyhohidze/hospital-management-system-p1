<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 form-container">
    <h1 class="mb-4">Add Patient</h1>
    <form th:action="@{/patients/add}" th:object="${patientForm}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name:</label>
            <input type="text" th:field="*{firstName}" id="firstName" class="form-control" required />
            <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            <div class="invalid-feedback">First name is required.</div>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name:</label>
            <input type="text" th:field="*{lastName}" id="lastName" class="form-control" required />
            <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            <div class="invalid-feedback">Last name is required.</div>
        </div>

        <div class="mb-3">
            <label for="patient_id" class="form-label">Patient ID (P0000):</label>
            <input type="text" th:field="*{patientId}" id="patient_id" class="form-control" required pattern="^[P]{1}[0-9]{4}$" />
            <div th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
            <div class="invalid-feedback">Patient ID must follow the format P0000.</div>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age:</label>
            <input type="number" th:field="*{age}" id="age" class="form-control" required min="0" />
            <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
            <div class="invalid-feedback">Please enter a valid age.</div>
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender:</label>
            <select th:field="*{gender}" id="gender" class="form-select" required>
                <option value="" disabled selected>Select Gender</option>
                <option th:each="g : ${T(be.kdg.programming3.domain.Gender).values()}"
                        th:value="${g}" th:text="${g.name()}">
                </option>
            </select>
            <div class="invalid-feedback">Please select a gender.</div>
        </div>


        <div class="mb-3">
            <label for="admissionDate" class="form-label">Admission Date:</label>
            <input type="date" th:field="*{admissionDate}" id="admissionDate" class="form-control" required />
            <div th:if="${#fields.hasErrors('admissionDate')}" th:errors="*{admissionDate}"></div>
            <div class="invalid-feedback">Admission date is required.</div>
        </div>

        <div class="mb-3">
            <label for="billing_amount" class="form-label">Billing Amount:</label>
            <input type="number" th:field="*{billingAmount}" id="billing_amount" class="form-control" required min="0" />
            <div th:if="${#fields.hasErrors('billingAmount')}" th:errors="*{billingAmount}"></div>
            <div class="invalid-feedback">Billing amount is required.</div>
        </div>

        <button type="submit" class="btn btn-primary">Add Patient</button>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- validation for fields -->
<script>
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')

        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

</body>
</html>
