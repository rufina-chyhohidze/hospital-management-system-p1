<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patients</title>
</head>
<body>
<nav>
  <a href="/patients">All Patients</a> | <a href="/doctors">All Doctors</a> | <a href="patients/add">Add Patient</a> | <a href="/doctors/add">Add Doctor</a>
</nav>
<h1>All Patients</h1>
<table>
  <tr>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Patient ID</th>
    <th>Age</th>
    <th>Gender</th>
    <th>Admission Date</th>
    <th>Billing amount</th>
    <th></th>
  </tr>
  <tr th:each = "patient: ${patients}">
    <td th:text="${patient.firstName}">First Name</td>
    <td th:text="${patient.lastName}">Last Name</td>
    <td th:text="${patient.patientId}">Patient ID </td>
    <td th:text="${patient.age}">Age</td>
    <td th:text="${patient.gender}">Gender</td>
    <td th:text="${patient.admissionDate}">Admission Date</td>
    <td th:text="${patient.billingAmount}">Billing amount</td>

  </tr>
</table>

</body>
</html>
