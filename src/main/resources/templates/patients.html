<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" th:href="@{/static/css/style.css}" href="/static/css/style.css">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
  <h1 class="mb-4">All Patients</h1>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Patient ID</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Admission Date</th>
        <th>Billing Amount</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="patient : ${patients}">
        <td th:text="${patient.firstName}">First Name</td>
        <td th:text="${patient.lastName}">Last Name</td>
        <td th:text="${patient.patientId}">Patient ID</td>
        <td th:text="${patient.age}">Age</td>
        <td th:text="${patient.gender}">Gender</td>
        <td th:text="${patient.admissionDate}">Admission Date</td>
        <td th:text="${patient.billingAmount}">Billing Amount</td>
        <td>
          <a th:href="@{'/patients/' + ${patient.patientId}}" class="btn btn-info btn-sm">
            View Details
          </a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
